
name: Build SpiceTech Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository files
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q SpiceTech-Wireless-Camera-v0.1.2-cloud-build.zip -d source
          ls -la source

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: |
          gradle --no-daemon -p source :android-camera:app:assembleDebug

      - name: Save APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: spicetech-wireless-camera-debug-apk
          path: source/android-camera/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
          
